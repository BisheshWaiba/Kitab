; PHP settings for the Docker image (copied to conf.d by the Dockerfile).
; Keeps sessions in the database: see includes/session_store.php.
auto_prepend_file = /var/www/html/includes/session_store.php

; Errors go to the log (Vercel > Logs), never to the visitor's screen
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; The site accepts pictures up to 2 MB
upload_max_filesize = 3M
post_max_size = 8M
